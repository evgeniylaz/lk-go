<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открыть в Lords & Knights</title>
<style>body{font:18px system-ui,sans-serif;background:#121a15;color:#e4ebe5;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:16px}
a{display:inline-block;margin-top:16px;padding:16px 28px;background:#7fbf9b;color:#121a15;border-radius:10px;font-weight:700;text-decoration:none;font-size:20px}
code{color:#93a399;font-size:14px;word-break:break-all}</style></head>
<body><div><div id="t">Открываю игру…</div><a id="b" href="#">Открыть в игре</a><p><code id="c"></code></p></div>
<script>
var q=new URLSearchParams(location.search),c=(q.get('c')||'').replace(/[^0-9,]/g,''),w=(q.get('w')||'347').replace(/\D/g,'');
if(/^\d{5},\d{5}$/.test(c)){var u='l+k://coordinates?'+c+'&'+w;document.getElementById('b').href=u;document.getElementById('c').textContent=u;location.href=u;}
else{document.getElementById('t').textContent='В ссылке нет координат';document.getElementById('b').hidden=true}
</script></body></html>
